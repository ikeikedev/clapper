[package]
name = "app"
version = "1.0.0"
description = "Clapper - マルチカム同期エディタ（音声波形でカメラ映像を自動同期するデスクトップ編集アプリ）"
authors = ["ike <dx009386ikeda@gmail.com>"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
hound = "3.5"
tauri-plugin-dialog = "2.7.1"
rustfft = "6.1"
urlencoding = "2.1.3"
tauri-plugin-fs = "2.5.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
